[tools]  # tombi: format.rules.table-keys-order = "ascending"
betterleaks = "latest"
dotnet = "10"
editorconfig-checker = "latest"
"github:mhersson/mpls" = "latest"
hk = "latest"
jactionlint = "latest"
marksman = "latest"
node = "lts"
"npm:yaml-language-server" = "latest"
pkl = "latest"
"pypi:jsonschema-markdown" = { version = "latest", python = "3.14" }
rumdl = "latest"
rust = { version = "1.99.1", components = "rust-analyzer", profile = "default" }
shellcheck = "latest"
tombi = "latest"
typos = "latest"
uv = "latest"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.lint]
description = "Run hk lints"
run = "hk check --all"

[tasks.ci]
description = "Run CI related tasks"
depends = ["lint", "test"]
run = "echo 'CI completed successfully'"
